/* ---- Dataedo branding (dataedo.com: navy #151924, blue #1d74f5, Inter) ---- */
:root{--bg: #f4f5f6;--ink: #151924;--ink-2: #3c4858;--ink-3: #6b7280;--border: #e5e7eb;--border-strong: #d1d5db;--brand: #1d74f5;--brand-strong: #155fd0;--brand-soft: #e8f1fe;--navy: #151924}
html{touch-action:manipulation}
html,body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
a.btn{text-decoration:none}
.btn--primary{box-shadow:0 1px 2px #1d74f54d}
.btn:disabled{opacity:.45;cursor:default}
.app{min-height:100vh;min-height:100dvh}
.app-main{padding:14px 24px}
.app-footer{padding:4px 16px 8px}
.app-header{height:64px;padding:0 max(28px,env(safe-area-inset-left))}
.brand{gap:14px}
.brand__logo{display:inline-flex;color:#485258}
.brand__logo svg{display:block;width:auto;height:30px}
.brand__divider{height:22px}
.brand__product{color:var(--ink);font-size:16px;font-weight:600}

/* hub */
.hub__hero{max-width:none;margin:0 0 14px;padding:34px 24px 26px;text-align:center}
.hub__hero .hub__title{margin:0 0 16px;color:var(--ink);font-size:42px}
.hub__title span{color:var(--brand)}
.hub__hero .hub__lead{max-width:760px;margin:0 auto;color:var(--ink-2)}

/* headings: Satoshi Medium, as on dataedo.com */
.hub__title,.game-card__title,.scores__title,.nd__title{font-family:Satoshi,var(--font-sans);font-weight:500;letter-spacing:-.01em}
.hub__grid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.game-card{padding:22px 24px 18px;border-radius:16px;overflow:hidden;box-shadow:none}
.game-card__thumb{position:relative;display:block;margin:-22px -24px 12px;padding:0;border:0;border-bottom:1px solid var(--border);background:#0b1f5c;cursor:pointer}
.game-card__thumb img{display:block;width:100%;height:148px;object-fit:cover;object-position:50% 50%;transition:transform .3s}
.game-card:hover .game-card__thumb img{transform:scale(1.03)}
.game-card__thumb .tag{position:absolute;top:12px;right:12px;border-color:transparent;background:#ffffffe6;box-shadow:var(--shadow-sm)}
.game-card>.lb{min-height:128px;margin-top:12px;padding-top:10px}
.game-card .lb__list li{padding:3px 10px}
.game-card .lb__head{margin-bottom:6px}
.game-card__top{margin-bottom:12px}
.game-card__footer{margin-top:12px}

/* scoreboard (hub + scoreboard page) */
.lb{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.lb__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.lb__title{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lb__rank{color:var(--brand);font-size:13px;font-weight:700}
.lb__empty{color:var(--ink-3);font-size:14px}
.lb__list{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.lb__list li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 10px;border-radius:8px;background:var(--surface-2);font-size:14px}
.lb__pos{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:var(--border);color:var(--ink-2);font-size:12px;font-weight:700}
.lb__list li:nth-child(1) .lb__pos{background:#ffd34d;color:#5a4300}
.lb__list li:nth-child(2) .lb__pos{background:#d7dce3;color:#3c4858}
.lb__list li:nth-child(3) .lb__pos{background:#f0c39a;color:#6b3d12}
.lb__name{overflow:hidden;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.lb__score{font-weight:700;font-variant-numeric:tabular-nums}
.lb__list li.is-me{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.lb__list li.lb__gap{display:block;padding:0;background:none;color:var(--ink-3);text-align:center;line-height:1}

/* scoreboard inside the retro game dialogs */
.lb--retro{margin:0;padding:12px 14px;border:0;background:#0b1f5c}
.lb--retro .lb__title{color:var(--dim);font-family:var(--pixel);font-size:10px;letter-spacing:0}
.lb--retro .lb__rank{color:var(--yellow);font-family:var(--pixel);font-size:10px}
.lb--retro .lb__empty{color:var(--dim)}
.lb--retro .lb__list li{padding:4px 10px;border-radius:0;background:#0a0a1f;font-size:22px;line-height:1.1}
.lb--retro .lb__pos,.lb--retro .lb__list li:nth-child(n) .lb__pos{border-radius:0;background:#1f5eff;color:#fff;font-family:var(--pixel);font-size:9px}
.lb--retro .lb__list li:nth-child(1) .lb__pos{background:var(--yellow);color:var(--ink)}
.lb--retro .lb__name,.lb--retro .lb__score{font-weight:400}
.lb--retro .lb__list li.is-me{background:#1f5eff;box-shadow:inset 0 0 0 2px var(--yellow)}
.lb--retro .lb__list li.lb__gap{color:var(--dim);background:none}
.pp-dialog .pp-review{order:1}
.pp-hud__stats dd.is-low{color:var(--red)}

/* enter-name dialog */
.nd-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:#15192499;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.nd{width:100%;max-width:460px;padding:30px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-lg)}
.nd__title{margin:6px 0 4px;font-size:28px;letter-spacing:-.01em}
.nd__lead{color:var(--ink-2)}
.nd__input{width:100%;height:58px;margin:20px 0;padding:0 16px;border:2px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:22px}
.nd__input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.nd__actions{display:flex;gap:10px}
.nd__actions .btn--primary{flex:1}

/* scoreboard page */
.scores{width:100%;max-width:1080px}
.scores__head{margin:12px 0 20px}
.scores__title{margin-top:6px;font-size:36px;letter-spacing:-.02em}
.scores__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.scores__card{padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.scores__card-head{display:flex;align-items:center;gap:12px}
.scores__card .lb{margin-top:16px}
.scores__card .lb__list li{padding:9px 12px;font-size:16px}
.scores__admin{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

/* in-game: more room for the stage */
.app.is-game .app-main{padding:12px}
.app.is-game .app-footer{display:none}

/* touch screens (iPad): hide keyboard-only hints */
@media (pointer:coarse){.pp-title__keys,.pd-title__keys{display:none}}
</style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
